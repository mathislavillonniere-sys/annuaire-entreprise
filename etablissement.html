<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiche établissement fictif</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/apple_touch_icon_8ffa1fa80c.png"
    />
  </head>
  <body>
    <div class="notice">
      Site pédagogique : tous les établissements présentés sont fictifs.
    </div>
    <header class="top">
      <a class="brand" href="index.html"
        ><span class="badge">FICTIF</span
        ><span><strong>Annuaire</strong> des Entreprises Fictives</span></a
      >
      <form class="search" action="index.html">
        <input placeholder="Nom, enseigne, adresse, n° SIRET/SIREN…" disabled />
        <button type="button" onclick="location.href = 'index.html'">🔍</button>
      </form>
      <a class="admin-link" href="admin.html">Espace administrateur</a>
    </header>

    <main id="app" class="wide"><p class="muted">Chargement…</p></main>

    <script type="module">
      import { db } from "./firebase-config.js";
      import {
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      import { esc, norm, fmtSiren, fmtSiret, fmtDate } from "./utils.js";
      import { NAF } from "./naf.js";

      const nafLabel = (c) => (NAF.find((x) => x[0] === c) || [])[1] || "";
      const app = document.getElementById("app");
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const nicParam = params.get("nic");
      const siretParam = (params.get("siret") || "").replace(/\s/g, "");

      const allSnap = await getDocs(collection(db, "entreprises"));
      const allEntreprises = allSnap.docs.map((d) => ({
        id: d.id,
        ...d.data(),
      }));

      let e = null;
      if (id) {
        e = allEntreprises.find((x) => x.id === id) || null;
      } else if (siretParam.length >= 9) {
        const siren = siretParam.slice(0, 9);
        e = allEntreprises.find((x) => x.siren === siren) || null;
      }

      if (!e) {
        app.innerHTML =
          "<h1>Établissement introuvable</h1><p><a href='index.html'>Retour à la recherche</a></p>";
      } else {
        const siegeNic = e.nic || "00015";
        const targetNic =
          nicParam ||
          (siretParam.length === 14 ? siretParam.slice(9) : siegeNic);

        const isSiege = targetNic === siegeNic;
        const rawEtab = isSiege
          ? {
              nic: siegeNic,
              siret: (e.siren || "") + siegeNic,
              naf: e.naf,
              activite: e.activite || nafLabel(e.naf),
              nafSecondaires: e.nafSecondaires || [],
              historiqueNoms: (e.historiqueNoms || []).filter(
                (h) =>
                  h.ancienNom &&
                  (/siège|siege|enseigne/i.test(h.motif || "") ||
                    !e.enseigneSiege),
              ),
              groupes: e.groupes || [],
              enseigne: e.enseigneSiege || "",
              adresse:
                `${e.adresse || ""} ${e.cp || ""} ${e.ville || ""}`.trim(),
              dateCreation: e.dateOuvertureSiege || e.dateCreation,
              dateFermeture:
                e.statut === "Cessée" ? e.dateCessation || "Fermé" : "",
              roleEtab: "Siège social",
            }
          : (e.etablissements || []).find(
              (x) =>
                x.nic === targetNic ||
                (x.siret &&
                  String(x.siret).replace(/\s/g, "").slice(9) === targetNic),
            );

        if (!rawEtab) {
          app.innerHTML = `<h1>Établissement introuvable</h1><p><a href="entreprise.html?id=${esc(e.id)}">← Retour à l'entreprise ${esc(e.denomination)}</a></p>`;
        } else {
          /* Détection : Ancien siège social transféré */
          const isAncienSiege =
            !isSiege &&
            /ancien siège|ancien siege/i.test(rawEtab.roleEtab || "");

          /* Liste des anciens sièges sociaux de l'entreprise (utile sur la fiche du siège actuel) */
          const anciensSiegesList = (e.etablissements || [])
            .filter((x) => /ancien siège|ancien siege/i.test(x.roleEtab || ""))
            .map((x) => {
              const nic =
                x.nic ||
                (x.siret ? String(x.siret).replace(/\s/g, "").slice(9) : "");
              return {
                ...x,
                nic,
                siret: x.siret || (e.siren || "") + nic,
              };
            });

          /* Détection précise : Ancien groupe, Repreneur, État, Salariés */
          const estAncien = (g) => {
            if (g.dateFin) return true;
            const t = g.type || "";
            if (/^reprise|^rachat/i.test(t)) return false;
            return /^ancien|cédé|cede/i.test(t);
          };
          const estReprise = (g) =>
            !estAncien(g) &&
            (/reprise|rachat/i.test(g.type || "") ||
              /repris/i.test(g.commentaire || ""));
          const estEtat = (g) =>
            /etat|état|publique|collectivit|ape|cdc|bpifrance/i.test(
              `${g.groupe || ""} ${g.sirenGroupe || ""} ${g.type || ""}`,
            );
          const estSalaries = (g) =>
            /salari[eé]s?|scop|fcpe/i.test(
              `${g.groupe || ""} ${g.sirenGroupe || ""} ${g.type || ""}`,
            );

          const siret =
            rawEtab.siret || (e.siren || "") + (rawEtab.nic || targetNic);
          const siegeActuelSiret = (e.siren || "") + siegeNic;
          const siegeActuelUrl = `etablissement.html?id=${encodeURIComponent(e.id)}&nic=${encodeURIComponent(siegeNic)}`;
          const siegeActuelAdresse =
            `${e.adresse || ""} ${e.cp || ""} ${e.ville || ""}`.trim();

          const historiqueNomsEtab = (rawEtab.historiqueNoms || []).filter(
            (h) => h.ancienNom,
          );

          const fmtPeriodeNom = (h) => {
            if (h.dateDebut && h.dateChangement)
              return `Du ${fmtDate(h.dateDebut)} au ${fmtDate(h.dateChangement)}`;
            if (h.dateChangement)
              return `Jusqu'au ${fmtDate(h.dateChangement)}`;
            if (h.dateDebut) return `Depuis le ${fmtDate(h.dateDebut)}`;
            return "Ancien nom";
          };

          /* Groupes & Actionnaires rattachés à cet établissement (directement ou via son unité légale) */
          const groupesEtab = [
            ...(rawEtab.groupes || []).map((g) => ({
              ...g,
              portee: g.activiteCible || "Cet établissement",
              fromEtab: true,
            })),
            ...(!isSiege
              ? (e.groupes || []).map((g) => ({
                  ...g,
                  portee: g.activiteCible
                    ? `${g.activiteCible} (via unité légale)`
                    : "Via l'unité légale mère",
                  fromEtab: false,
                }))
              : []),
          ].filter((g) => g.groupe);

          const groupesActuels = groupesEtab.filter((g) => !estAncien(g));

          // Ajout de l'entreprise d'origine comme "Ancien groupe" uniquement si elle est Cessée/Liquidée ou si l'établissement a été explicitement repris
          const etabExplicitementRepris = (rawEtab.groupes || []).some((g) =>
            estReprise(g),
          );

          if (
            !isSiege &&
            (e.statut === "Cessée" || etabExplicitementRepris) &&
            groupesActuels.length > 0 &&
            !groupesEtab.some(
              (g) =>
                estAncien(g) &&
                (norm(g.groupe) === norm(e.denomination) ||
                  String(g.sirenGroupe || "").replace(/\s/g, "") === e.siren),
            )
          ) {
            const dateReprise =
              (groupesActuels.find((g) => g.dateDebut) || {}).dateDebut || "";
            groupesEtab.push({
              groupe: e.denomination,
              sirenGroupe: e.siren,
              portee: "Groupe d'origine de l'établissement",
              pourcentage: 100,
              type:
                e.statut === "Cessée"
                  ? "Ancien groupe (Faillite / Liquidation)"
                  : "Ancien groupe (Cédé)",
              dateDebut: rawEtab.dateCreation || e.dateCreation || "",
              dateFin: e.dateCessation || dateReprise || "Liquidé",
              commentaire:
                e.statut === "Cessée"
                  ? `Groupe d'origine liquidé — Établissement repris par ${groupesActuels.map((x) => x.groupe).join(", ")}`
                  : "Ancien propriétaire avant reprise de l'établissement",
            });
          }

          const anciensGroupes = groupesEtab.filter((g) => estAncien(g));
          const aUneReprise =
            anciensGroupes.length > 0 ||
            groupesActuels.some((g) => estReprise(g));

          /* Statut d'activité de l'établissement */
          const reprisEtActif =
            !isSiege && !rawEtab.dateFermeture && groupesActuels.length > 0;
          const actif =
            !rawEtab.dateFermeture && (e.statut !== "Cessée" || reprisEtActif);

          const mainNaf = rawEtab.naf || e.naf;
          const mainAct =
            rawEtab.activite || nafLabel(mainNaf) || e.activite || "";
          const titreEtab = rawEtab.enseigne
            ? `${rawEtab.enseigne} (${e.denomination})`
            : `${e.denomination} — Établissement ${targetNic}`;

          document.title = `${titreEtab} — Fiche établissement`;

          const fmtPeriode = (d1, d2, ancien, reprise) => {
            if (d1 && d2 && d2 !== "Liquidé")
              return `Du ${fmtDate(d1)} au ${fmtDate(d2)}`;
            if (d2 && d2 !== "Liquidé") return `Jusqu'au ${fmtDate(d2)}`;
            if (d1 && !ancien)
              return `${reprise ? "Repris le" : "Depuis le"} ${fmtDate(d1)}`;
            if (d1 && ancien) return `Créé le ${fmtDate(d1)} · Liquidé / Cédé`;
            return ancien ? "Ancien groupe (Liquidé / Cédé)" : "Actuel";
          };

          /* Activités NAF propres à CET établissement */
          const activitesEtab = [
            ...(mainNaf || mainAct
              ? [{ naf: mainNaf, lib: mainAct, type: "Principale" }]
              : []),
            ...(rawEtab.nafSecondaires || [])
              .filter((x) => x.naf || x.activite)
              .map((x) => ({
                naf: x.naf,
                lib: x.activite || nafLabel(x.naf),
                type: "Secondaire",
              })),
          ];

          /* Fonction de recherche d'une entreprise, d'un établissement, de l'État ou des Salariés */
          const resolveOwnerLink = (nom, code, gObj = {}) => {
            const clean = String(code || "").replace(/\s/g, "");
            if (estEtat({ groupe: nom, sirenGroupe: code, ...gObj })) {
              return `🏛️ <strong>${esc(nom || "État français")}</strong> <span class="pill etat" style="font-size:11px;margin-left:4px">Actionnaire public</span>`;
            }
            if (estSalaries({ groupe: nom, sirenGroupe: code, ...gObj })) {
              return `👥 <strong>${esc(nom || "Salariés")}</strong> <span class="pill salaries" style="font-size:11px;margin-left:4px">Actionnariat salarié</span>`;
            }
            if (clean.length === 14) {
              const ent = allEntreprises.find(
                (x) => x.siren === clean.slice(0, 9),
              );
              if (ent) {
                return `<a href="etablissement.html?id=${esc(ent.id)}&nic=${esc(clean.slice(9))}"><strong>${esc(nom || fmtSiret(clean))}</strong></a> <span class="muted">(Établissement ${fmtSiret(clean)})</span>`;
              }
            }
            const ent = allEntreprises.find(
              (x) =>
                (clean.length === 9 && x.siren === clean) ||
                (nom && norm(x.denomination) === norm(nom)) ||
                (nom && norm(x.nomCommercial || "") === norm(nom)) ||
                (nom &&
                  (x.historiqueNoms || []).some(
                    (h) => norm(h.ancienNom) === norm(nom),
                  )),
            );
            if (ent) {
              return `<a href="entreprise.html?id=${esc(ent.id)}"><strong>${esc(nom || ent.denomination)}</strong></a> <span class="muted">(SIREN ${fmtSiren(ent.siren)})</span>`;
            }
            for (const cand of allEntreprises) {
              if (
                cand.enseigneSiege &&
                nom &&
                norm(nom).includes(norm(cand.enseigneSiege))
              ) {
                return `<a href="etablissement.html?id=${esc(cand.id)}&nic=${esc(cand.nic || "00015")}"><strong>${esc(nom)}</strong></a>`;
              }
              for (const et of cand.etablissements || []) {
                if (
                  (et.enseigne &&
                    nom &&
                    norm(nom).includes(norm(et.enseigne))) ||
                  (et.historiqueNoms || []).some(
                    (h) => h.ancienNom && norm(nom).includes(norm(h.ancienNom)),
                  )
                ) {
                  return `<a href="etablissement.html?id=${esc(cand.id)}&nic=${esc(et.nic)}"><strong>${esc(nom)}</strong></a>`;
                }
              }
            }
            return `<strong>${esc(nom)}</strong>${clean && !/^(ETAT|SALARIES|FLOTTANT|FONDATEURS|COLLECTIVITE)/i.test(clean) ? ` <span class="muted">(${esc(clean)})</span>` : ""}`;
          };

          const renderGauge = (pct) => {
            if (pct === "" || pct == null || isNaN(pct)) return "—";
            const val = Math.max(0, Math.min(100, Number(pct)));
            return `
              <div class="gauge-wrap">
                <div class="gauge"><div class="gauge-bar" style="width:${val}%"></div></div>
                <strong>${val} %</strong>
              </div>`;
          };

          /* Bannière de transfert de siège social (affichée sur l'ancien siège fermé OU sur le nouveau siège) */
          const transfertSiegeBanner = isAncienSiege
            ? `<div class="reprise-banner">
                🚚 <strong>Ancien siège social (transféré et fermé) :</strong> Cet établissement était le siège social de
                <a href="entreprise.html?id=${esc(e.id)}"><strong>${esc(e.denomination)}</strong></a>
                ${rawEtab.dateCreation ? `du <strong>${fmtDate(rawEtab.dateCreation)}</strong> ` : ""}${rawEtab.dateFermeture && rawEtab.dateFermeture !== "Fermé" ? `jusqu'au <strong>${fmtDate(rawEtab.dateFermeture)}</strong>` : "avant son déménagement"}.
                Le siège social est désormais transféré sur l'établissement
                <a href="${siegeActuelUrl}"><strong>${esc(e.enseigneSiege || fmtSiret(siegeActuelSiret))} (SIRET ${fmtSiret(siegeActuelSiret)})</strong></a>
                situé au <strong>${esc(siegeActuelAdresse)}</strong>.
              </div>`
            : isSiege && anciensSiegesList.length
              ? `<div class="reprise-banner">
                  🏛️ <strong>Historique du siège social :</strong> Cet établissement est le nouveau siège social de
                  <strong>${esc(e.denomination)}</strong>${e.dateOuvertureSiege ? ` depuis le <strong>${fmtDate(e.dateOuvertureSiege)}</strong>` : ""}.
                  Il succède ${anciensSiegesList.length > 1 ? "aux anciens sièges sociaux fermés" : "à l'ancien siège social fermé"} :
                  ${anciensSiegesList
                    .map(
                      (as) =>
                        `<a href="etablissement.html?id=${encodeURIComponent(e.id)}&nic=${encodeURIComponent(as.nic)}"><strong>${fmtSiret(as.siret)}</strong></a> (${esc(as.adresse)}${as.dateFermeture && as.dateFermeture !== "Fermé" ? ` — fermé le ${fmtDate(as.dateFermeture)}` : ""})`,
                    )
                    .join(", ")}.
                </div>`
              : "";

          const repriseBanner =
            anciensGroupes.length && groupesActuels.length
              ? `<div class="reprise-banner">
                  🔄 <strong>Historique de reprise de l'établissement :</strong> Suite à la liquidation / cession de son ancien groupe
                  ${anciensGroupes
                    .map(
                      (a) =>
                        `${resolveOwnerLink(a.groupe, a.sirenGroupe, a)}${a.dateFin && a.dateFin !== "Liquidé" ? ` (le ${fmtDate(a.dateFin)})` : ""}`,
                    )
                    .join(", ")},
                  l'établissement <strong>${esc(rawEtab.enseigne || titreEtab)}</strong> a été repris par
                  ${groupesActuels
                    .map(
                      (g) =>
                        `${resolveOwnerLink(g.groupe, g.sirenGroupe, g)}${g.dateDebut ? ` le <strong>${fmtDate(g.dateDebut)}</strong>` : ""}`,
                    )
                    .join(", ")}.
                </div>`
              : "";

          /* Entreprises ou autres établissements DÉTENUS par CET établissement (y compris sous un ancien nom) */
          const matchesThisEtab = (g) => {
            const cleanCode = String(g.sirenGroupe || "").replace(/\s/g, "");
            if (cleanCode && cleanCode === siret) return true;
            if (isSiege && cleanCode && cleanCode === e.siren) return true;
            if (!g.groupe) return false;
            const ng = norm(g.groupe);
            if (rawEtab.enseigne && ng === norm(rawEtab.enseigne)) return true;
            if (
              rawEtab.enseigne &&
              ng === norm(`${rawEtab.enseigne} (${e.denomination})`)
            )
              return true;
            if (
              historiqueNomsEtab.some(
                (h) =>
                  norm(h.ancienNom) === ng ||
                  norm(`${h.ancienNom} (${e.denomination})`) === ng,
              )
            )
              return true;
            if (ng === norm(`Établissement ${targetNic} — ${e.denomination}`))
              return true;
            if (isSiege && ng === norm(e.denomination)) return true;
            return false;
          };

          const filialesDetenues = [];
          allEntreprises.forEach((cand) => {
            (cand.groupes || []).forEach((g) => {
              if (cand.id === e.id && isSiege) return;
              if (matchesThisEtab(g)) {
                const anc = estAncien(g);
                const repreneurObj = anc
                  ? (cand.groupes || []).find((x) => x.groupe && !estAncien(x))
                  : null;
                const ancienObj = !anc
                  ? (cand.groupes || []).find((x) => x.groupe && estAncien(x))
                  : null;
                filialesDetenues.push({
                  label: cand.denomination,
                  anciensNoms: (cand.historiqueNoms || [])
                    .map((h) => h.ancienNom)
                    .filter(Boolean),
                  sub: `Unité légale · SIREN ${fmtSiren(cand.siren)}`,
                  href: `entreprise.html?id=${esc(cand.id)}`,
                  cible: g.activiteCible || "Toute l'entreprise",
                  pourcentage: g.pourcentage,
                  type: g.type || "",
                  dateDebut: g.dateDebut || "",
                  dateFin: g.dateFin || "",
                  commentaire: g.commentaire || "",
                  ancien: anc,
                  reprise: estReprise(g),
                  repreneur: repreneurObj,
                  ancienProp: ancienObj,
                });
              }
            });

            (cand.etablissements || []).forEach((et) => {
              const etSiret = et.siret || (cand.siren || "") + (et.nic || "");
              if (cand.id === e.id && et.nic === targetNic) return;
              (et.groupes || []).forEach((g) => {
                if (matchesThisEtab(g)) {
                  const anc = estAncien(g);
                  const rep = estReprise(g);
                  const repreneurObj = anc
                    ? (et.groupes || []).find((x) => x.groupe && !estAncien(x))
                    : null;
                  let ancienObj = !anc
                    ? (et.groupes || []).find((x) => x.groupe && estAncien(x))
                    : null;
                  if (!anc && !ancienObj && (rep || cand.statut === "Cessée")) {
                    ancienObj = {
                      groupe: cand.denomination,
                      sirenGroupe: cand.siren,
                      dateFin: cand.dateCessation || g.dateDebut || "",
                    };
                  }
                  filialesDetenues.push({
                    label: et.enseigne
                      ? `${et.enseigne} (${cand.denomination})`
                      : `${cand.denomination} — Étab. ${et.nic}`,
                    anciensNoms: (et.historiqueNoms || [])
                      .map((h) => h.ancienNom)
                      .filter(Boolean),
                    sub: `Établissement · SIRET ${fmtSiret(etSiret)}`,
                    href: `etablissement.html?id=${esc(cand.id)}&nic=${esc(et.nic)}`,
                    cible: g.activiteCible || "Tout l'établissement",
                    pourcentage: g.pourcentage,
                    type: g.type || "",
                    dateDebut: g.dateDebut || "",
                    dateFin: g.dateFin || "",
                    commentaire: g.commentaire || "",
                    ancien: anc,
                    reprise: rep,
                    repreneur: repreneurObj,
                    ancienProp: ancienObj,
                  });
                }
              });
            });
          });

          app.innerHTML = `
            <p><a href="entreprise.html?id=${esc(e.id)}">← Retour à la fiche de l'entreprise ${esc(e.denomination)}</a></p>
            <h1>${esc(rawEtab.enseigne || e.denomination)}</h1>
            <p>
              <span class="pill ${isAncienSiege ? "ancien-siege" : "etab-type"}">${
                isSiege
                  ? "Établissement Siège social"
                  : isAncienSiege
                    ? "Ancien siège social (transféré)"
                    : "Établissement secondaire"
              }</span>
              <span class="muted">‣ SIRET ${fmtSiret(siret)}</span>
              <span class="pill ${actif ? "on" : "off"}">${
                actif
                  ? reprisEtActif && e.statut === "Cessée"
                    ? "En activité (Repris)"
                    : "En activité"
                  : isAncienSiege
                    ? `Transféré / Fermé${rawEtab.dateFermeture && rawEtab.dateFermeture !== "Fermé" ? ` le ${fmtDate(rawEtab.dateFermeture)}` : ""}`
                    : "Fermé"
              }</span>
              ${historiqueNomsEtab.map((h) => `<span class="pill reprise" style="margin-left:6px">Ancien nom : ${esc(h.ancienNom)}${h.dateChangement ? ` (jusqu'au ${fmtDate(h.dateChangement)})` : ""}</span>`).join("")}
              ${groupesActuels
                .map((g) => {
                  const isEt = estEtat(g);
                  const isSal = estSalaries(g);
                  const cls = isEt ? "etat" : isSal ? "salaries" : "grp";
                  const pref = isEt
                    ? "🏛️ "
                    : isSal
                      ? "👥 "
                      : estReprise(g)
                        ? "Repris par : "
                        : "Groupe : ";
                  return `<span class="pill ${cls}" style="margin-left:6px">${pref}${esc(g.groupe)}${g.pourcentage !== "" && g.pourcentage != null ? ` (${g.pourcentage} %)` : ""}</span>`;
                })
                .join("")}
              ${anciensGroupes.map((g) => `<span class="pill off" style="margin-left:6px;text-transform:none">Ancien groupe : ${esc(g.groupe)}</span>`).join("")}
            </p>

            ${transfertSiegeBanner}
            ${repriseBanner}

            <p class="intro">
              Cet établissement (SIRET <strong>${fmtSiret(siret)}</strong>) ${
                isSiege
                  ? "est le <strong>siège social actuel</strong>"
                  : isAncienSiege
                    ? "était un <strong>ancien siège social (aujourd'hui fermé et transféré)</strong>"
                    : "est un <strong>établissement</strong>"
              } de l'entreprise
              <a href="entreprise.html?id=${esc(e.id)}"><strong>${esc(e.denomination)}</strong></a> (SIREN ${fmtSiren(e.siren)}${e.statut === "Cessée" ? " — <em>entreprise liquidée / cessée</em>" : ""}).
              ${
                rawEtab.enseigne
                  ? `Il ${actif ? "exerce" : "exerçait"} sous le nom / l'enseigne <strong>${esc(rawEtab.enseigne)}</strong>${
                      historiqueNomsEtab.length
                        ? ` (anciennement dénommé ${historiqueNomsEtab
                            .map(
                              (h) =>
                                `<strong>${esc(h.ancienNom)}</strong>${h.dateChangement ? ` jusqu'au ${fmtDate(h.dateChangement)}` : ""}`,
                            )
                            .join(", ")})`
                        : ""
                    }.`
                  : ""
              }
              ${
                groupesActuels.length
                  ? aUneReprise
                    ? `Il est aujourd'hui repris et détenu par ${groupesActuels.map((g) => `${resolveOwnerLink(g.groupe, g.sirenGroupe, g)}${g.dateDebut ? ` (repris le <strong>${fmtDate(g.dateDebut)}</strong>)` : ""}`).join(", ")}.`
                    : `Il est détenu / rattaché à ${groupesActuels.map((g) => `${resolveOwnerLink(g.groupe, g.sirenGroupe, g)}${g.dateDebut ? ` (depuis le <strong>${fmtDate(g.dateDebut)}</strong>)` : ""}`).join(", ")}.`
                  : ""
              }
              Son activité principale est : <strong>${esc(mainAct)}</strong> (${esc(mainNaf)}).
              ${
                activitesEtab.length > 1
                  ? `Il compte également ${activitesEtab.length - 1} activité${activitesEtab.length - 1 > 1 ? "s" : ""} secondaire${activitesEtab.length - 1 > 1 ? "s" : ""}.`
                  : ""
              }
              ${
                filialesDetenues.length
                  ? `Il détient (ou a détenu) des participations dans <strong>${filialesDetenues.length} structure${filialesDetenues.length > 1 ? "s" : ""}</strong>.`
                  : ""
              }
            </p>

            <section class="panel active" style="border-top:2px solid var(--border);margin-top:24px">
              <h3>Informations de l'établissement</h3>
              <table class="info">
                <tr><th>SIRET de l'établissement</th><td><strong>${fmtSiret(siret)}</strong> (NIC : ${esc(targetNic)})</td></tr>
                <tr><th>${e.statut === "Cessée" ? "Groupe / Unité légale d'origine" : "Unité légale (Entreprise mère)"}</th><td>
                  <a href="entreprise.html?id=${esc(e.id)}"><strong>${esc(e.denomination)}</strong></a> — SIREN ${fmtSiren(e.siren)}
                  ${e.statut === "Cessée" ? `<span class="pill off" style="margin-left:8px;text-transform:none">Liquidée / Cessée${e.dateCessation ? ` le ${fmtDate(e.dateCessation)}` : ""}</span>` : `<span class="pill on" style="margin-left:8px;text-transform:none">En activité</span>`}
                </td></tr>
                ${
                  groupesActuels.length
                    ? `<tr><th>${aUneReprise ? "Groupe / Repreneur actuel" : "Actionnariat / Groupe"}</th><td>${groupesActuels
                        .map((g) => {
                          const rep = estReprise(g) || e.statut === "Cessée";
                          const isEt = estEtat(g);
                          const isSal = estSalaries(g);
                          const cls = isEt
                            ? "etat"
                            : isSal
                              ? "salaries"
                              : rep
                                ? "on"
                                : "grp";
                          return `${resolveOwnerLink(g.groupe, g.sirenGroupe, g)} <span class="pill ${cls}" style="margin-left:6px;text-transform:none">${
                            g.dateDebut
                              ? `${rep ? "Repris le" : "Depuis le"} ${fmtDate(g.dateDebut)}`
                              : "Actionnaire actuel"
                          } (${g.pourcentage ?? 100} %)</span>`;
                        })
                        .join("<br>")}</td></tr>`
                    : ""
                }
                <tr><th>Statut de l'établissement</th><td>${
                  actif
                    ? `<span class="pill on">${reprisEtActif && e.statut === "Cessée" ? "En activité (Repris suite à la liquidation de " + esc(e.denomination) + ")" : "En activité"}</span>`
                    : `<span class="pill off">${isAncienSiege ? "Fermé (Siège social transféré)" : "Fermé"}${rawEtab.dateFermeture && rawEtab.dateFermeture !== "Fermé" ? ` le ${fmtDate(rawEtab.dateFermeture)}` : ""}</span>`
                }</td></tr>
                <tr><th>Type / Rôle de l'établissement</th><td>${
                  isSiege
                    ? `<span class="pill siege" style="margin:0">Siège social actuel</span>${e.dateOuvertureSiege ? ` <span class="muted">(siège depuis le ${fmtDate(e.dateOuvertureSiege)})</span>` : ""}`
                    : isAncienSiege
                      ? `<span class="pill ancien-siege" style="margin:0">Ancien siège social (transféré)</span>`
                      : "Établissement secondaire"
                }</td></tr>
                ${
                  isAncienSiege
                    ? `<tr><th>Nouveau siège social actuel</th><td>
                        <a href="${siegeActuelUrl}"><strong>${fmtSiret(siegeActuelSiret)}</strong>${e.enseigneSiege ? ` — ${esc(e.enseigneSiege)}` : ""}</a>
                        <span class="muted">(${esc(siegeActuelAdresse)}${e.dateOuvertureSiege ? ` · depuis le ${fmtDate(e.dateOuvertureSiege)}` : ""})</span>
                      </td></tr>`
                    : ""
                }
                ${
                  isSiege && anciensSiegesList.length
                    ? `<tr><th>Ancien${anciensSiegesList.length > 1 ? "s" : ""} siège${anciensSiegesList.length > 1 ? "s" : ""} social${anciensSiegesList.length > 1 ? "aux" : ""}</th><td>
                        ${anciensSiegesList
                          .map(
                            (as) =>
                              `<div style="margin-bottom:4px"><a href="etablissement.html?id=${encodeURIComponent(e.id)}&nic=${encodeURIComponent(as.nic)}"><strong>${fmtSiret(as.siret)}</strong></a> — ${esc(as.adresse)} <span class="pill ancien-siege" style="font-size:11px;margin-left:4px">Fermé / Transféré${as.dateFermeture && as.dateFermeture !== "Fermé" ? ` le ${fmtDate(as.dateFermeture)}` : ""}</span></div>`,
                          )
                          .join("")}
                      </td></tr>`
                    : ""
                }
                ${rawEtab.enseigne ? `<tr><th>Nom / Enseigne actuelle</th><td><strong>${esc(rawEtab.enseigne)}</strong></td></tr>` : ""}
                ${
                  historiqueNomsEtab.length
                    ? `<tr><th>Ancien${historiqueNomsEtab.length > 1 ? "s" : ""} nom${historiqueNomsEtab.length > 1 ? "s" : ""} / enseigne${historiqueNomsEtab.length > 1 ? "s" : ""}</th><td>
                        ${historiqueNomsEtab
                          .map(
                            (h) =>
                              `<div><strong>${esc(h.ancienNom)}</strong> — ${fmtPeriodeNom(h)}${h.motif ? ` <em>(${esc(h.motif)})</em>` : ""}</div>`,
                          )
                          .join("")}
                      </td></tr>`
                    : ""
                }
                <tr><th>Activité principale (NAF/APE)</th><td><strong>${esc(mainNaf)}</strong> — ${esc(mainAct)}</td></tr>
                <tr><th>Adresse postale</th><td>${esc(rawEtab.adresse)}</td></tr>
                <tr><th>Date d'ouverture / création</th><td>${fmtDate(rawEtab.dateCreation || e.dateCreation)}</td></tr>
                ${
                  rawEtab.dateFermeture && rawEtab.dateFermeture !== "Fermé"
                    ? `<tr><th>Date de fermeture${isAncienSiege ? " / transfert" : ""}</th><td>${fmtDate(rawEtab.dateFermeture)}</td></tr>`
                    : ""
                }
              </table>

              <div class="two-col-grid">
                <section class="etabs-box" style="margin-top:0">
                  <h3>Activités NAF & Historique du nom</h3>
                  <p class="muted" style="margin-top:0">Chaque établissement possède ses propres codes NAF (principale et secondaires) :</p>
                  ${
                    activitesEtab.length
                      ? `<div class="etab-wrap"><table class="list">
                          <tr><th>Code NAF</th><th>Activité exercée dans l'établissement</th><th>Type</th></tr>
                          ${activitesEtab
                            .map(
                              (a) => `<tr>
                            <td><strong>${esc(a.naf || "—")}</strong></td>
                            <td>${esc(a.lib)}</td>
                            <td><span class="pill ${a.type === "Principale" ? "on" : "bilan"}">${esc(a.type)}</span></td>
                          </tr>`,
                            )
                            .join("")}
                        </table></div>`
                      : "<p class='muted'>Aucune activité renseignée pour cet établissement.</p>"
                  }

                  ${
                    historiqueNomsEtab.length
                      ? `<h4 style="margin-top:24px">Historique des changements de nom de cet établissement (${historiqueNomsEtab.length})</h4>
                        <div class="etab-wrap"><table class="list">
                          <tr><th>Ancien nom / Enseigne</th><th>Période</th><th>Motif</th></tr>
                          ${historiqueNomsEtab
                            .map(
                              (h) => `<tr>
                            <td><strong>${esc(h.ancienNom)}</strong></td>
                            <td>${fmtPeriodeNom(h)}</td>
                            <td><span class="pill reprise">${esc(h.motif || "Changement d'enseigne")}</span></td>
                          </tr>`,
                            )
                            .join("")}
                        </table></div>`
                      : ""
                  }
                </section>

                <section class="etabs-box" style="margin-top:0">
                  <h3>Actionnariat, Groupes, État, Salariés & Détention</h3>
                  <h4>Rattachement (${aUneReprise ? "Repreneur actuel & Ancien groupe" : "Actionnaires & Groupes propriétaires"})</h4>
                  ${
                    groupesEtab.length
                      ? `<div class="etab-wrap"><table class="list">
                          <tr><th>Actionnaire / Groupe / Propriétaire</th><th>Périmètre</th><th>Statut & Période</th><th>Détention</th></tr>
                          ${groupesEtab
                            .map((g) => {
                              const anc = estAncien(g);
                              const rep = estReprise(g);
                              const isEt = estEtat(g);
                              const isSal = estSalaries(g);
                              const pillCls = anc
                                ? "off"
                                : isEt
                                  ? "etat"
                                  : isSal
                                    ? "salaries"
                                    : "on";
                              return `<tr style="${anc ? "opacity:0.78" : ""}">
                                <td>${resolveOwnerLink(g.groupe, g.sirenGroupe, g)}</td>
                                <td>${esc(g.portee)}</td>
                                <td>
                                  <span class="pill ${pillCls}" style="text-transform:none">${esc(anc ? g.type || "Ancien groupe" : rep ? "Repris / Actif" : g.type || "Filiale / Rattaché")}</span>
                                  <div class="muted" style="margin-top:4px">
                                    <strong>${fmtPeriode(g.dateDebut, g.dateFin, anc, rep)}</strong>
                                    ${g.commentaire ? `<br><em>${esc(g.commentaire)}</em>` : ""}
                                  </div>
                                </td>
                                <td>${renderGauge(g.pourcentage)}</td>
                              </tr>`;
                            })
                            .join("")}
                        </table></div>`
                      : "<p class='muted'>Aucun rattachement de groupe ou d'actionnaire spécifique renseigné.</p>"
                  }

                  <h4 style="margin-top:24px">Entreprises & structures détenues (ou reprises) par cet établissement (${filialesDetenues.length})</h4>
                  ${
                    filialesDetenues.length
                      ? `<div class="etab-wrap"><table class="list">
                          <tr><th>Structure détenue</th><th>Périmètre / Activité</th><th>Statut & Historique</th><th>Part de détention</th></tr>
                          ${filialesDetenues
                            .map(
                              (
                                f,
                              ) => `<tr style="${f.ancien ? "opacity:0.78" : ""}">
                            <td>
                              <a href="${f.href}"><strong>${esc(f.label)}</strong></a>
                              ${
                                f.anciensNoms && f.anciensNoms.length
                                  ? `<div style="margin-top:2px"><span class="pill reprise" style="font-size:11px">Ex-nom : ${f.anciensNoms.map(esc).join(", ")}</span></div>`
                                  : ""
                              }
                              <div class="muted">${esc(f.sub)}</div>
                            </td>
                            <td>${esc(f.cible)}</td>
                            <td>
                              <span class="pill ${f.ancien ? "off" : "on"}">${f.ancien ? "Cédée / Ancienne détention" : f.reprise ? "En activité (Repris)" : "Active"}</span>
                              <div class="muted" style="margin-top:4px">
                                <strong>${fmtPeriode(f.dateDebut, f.dateFin, f.ancien, f.reprise)}</strong>
                                ${
                                  f.repreneur
                                    ? `<br>↪ Repris par ${resolveOwnerLink(f.repreneur.groupe, f.repreneur.sirenGroupe, f.repreneur)}`
                                    : ""
                                }
                                ${
                                  !f.ancien && f.ancienProp
                                    ? `<br>↩ Ancien groupe : ${resolveOwnerLink(f.ancienProp.groupe, f.ancienProp.sirenGroupe, f.ancienProp)}${f.ancienProp.dateFin ? ` (liquidé le ${fmtDate(f.ancienProp.dateFin)})` : " (liquidé)"}`
                                    : ""
                                }
                                ${f.commentaire ? `<br><em>${esc(f.commentaire)}</em>` : ""}
                              </div>
                            </td>
                            <td>${renderGauge(f.pourcentage)}</td>
                          </tr>`,
                            )
                            .join("")}
                        </table></div>`
                      : `<p class="muted">Cet établissement ne détient aucune autre entreprise pour le moment.</p>`
                  }
                </section>
              </div>
            </section>
          `;
        }
      }
    </script>
  </body>
</html>
