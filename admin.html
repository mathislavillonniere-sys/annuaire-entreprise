            <div>

            </div>

                <option>SARL, société à responsabilité limitée</option>

                <option>SASU</option>
                <option>SCOP, société coopérative et participative</option>
                <option>

            <div>

            </div>
            <div>

                <option>Entreprise de taille intermédiaire</option>
                <option>Grande Entreprise</option>

            </div>
            <div>
              <label>Tranche d'effectif</label>

                <option>10 à 19</option>

                <option>100 à 500</option>

                <option>1000 et plus</option>

            <div>
              <label>Capital social (€)</label

      const estAncienStatut = (g) => {
        if (g.dateFin) return true;
        const t = g.type || "";
        if (/^reprise|^rachat/i.test(t)) return false;
        return /^ancien|cédé|cede/i.test(t);
      };

      /* ---------- Génération automatique du NIC ---------- */
      function genererNic(siren, numEtab = 1) {
        const sirenClean = String(siren || "").replace(/\D/g, "");
        const nicBase = String(numEtab).padStart(4, "0");
        if (sirenClean.length === 9) {
          const base13 = sirenClean + nicBase;
          let somme = 0;
          for (let i = 0; i < 13; i++) {
            let c = parseInt(base13[i], 10);
            if (i % 2 === 0) {
              c *= 2;
              if (c > 9) c -= 9;
            }
            somme += c;
          }
          const cle = (10 - (somme % 10)) % 10;
          return nicBase + cle;
        }
        return nicBase + (Math.floor(Math.random() * 9) + 1);
      }

      function prochainNicEtablissement() {
        const existants = new Set([$("nic").value]);
        document
          .querySelectorAll(
            'fieldset[data-sec="etablissements"] input[data-k="nic"]',
          )
          .forEach((inp) => {
            if (inp.value) existants.add(inp.value);
          });
        let numero = existants.size + 1;
        let candidat = genererNic($("siren").value, numero);
        while (existants.has(candidat)) {
          numero++;
          candidat = genererNic($("siren").value, numero);
        }
        return candidat;
      }

      const SECTIONS = {

            ["activite", "Activité principale de l'établissement"],

            [

              ["Établissement secondaire", "Ancien siège social (transféré)"],
            ],

        documents: {

            ["titre", "Titre"],

            ["date", "Date", "date"],
          ],
        },
        finances: {
          title:

          cols: [
            ["annee", "Année (ex. 2025)"],
            ["dateCloture", "Date de clôture (auto 31/12, modifiable)", "date"],
            [
              "type",
              "Type de bilan",

              ["Complet", "Simplifié", "Consolidé"],

          ],

      let editingId = null;
      let originalDenomination = "";
      let originalEnseigneSiege = "";
      let originalDateCreation = "";
      let originalEtabNames = {}; // nic -> ancien nom d'enseigne avant édition
      let knownEntities = [];

      /* ---------- 1. Assistant de changement de nom de l'entreprise (ou filiale) ---------- */
      $("btnRename").addEventListener("click", () => {
        const currentNom =
          $("denomination").value.trim() || originalDenomination;
        if (!currentNom) return;

        const nouveauNom = prompt(
          `Nouvelle dénomination sociale (remplace « ${currentNom} ») :`,
        );
        if (
          !nouveauNom ||
          !nouveauNom.trim() ||
          nouveauNom.trim() === currentNom
        )
          return;

        const today = new Date().toISOString().slice(0, 10);
        const dateChg = prompt(
          `Date d'effet du changement de nom (passage de « ${currentNom} » à « ${nouveauNom.trim()} ») :`,
          today,
        );
        if (!dateChg) return;

        const motif =
          prompt(
            "Motif ou mention à afficher dans l'historique :",
            "Changement de dénomination sociale",
          ) || "Changement de dénomination sociale";

        const existingHist = collect("historiqueNoms");
        const lastChangeDate =
          existingHist.length > 0
            ? existingHist[existingHist.length - 1].dateChangement || ""
            : $("dateCreation").value || originalDateCreation || "";

        addRow("historiqueNoms", {
          ancienNom: currentNom,
          dateDebut: lastChangeDate,
          dateChangement: dateChg.trim(),
          motif: motif.trim(),
        });

        addRow("annonces", {
          date: dateChg.trim(),
          type: "Modification de dénomination",
          texte: `Ancienne dénomination : « ${currentNom} » — Nouvelle dénomination : « ${nouveauNom.trim()} » (${motif.trim()}).`,
        });

        $("denomination").value = nouveauNom.trim();
        originalDenomination = nouveauNom.trim();
      });

      /* ---------- 2. Assistant de changement de nom de l'enseigne du siège ---------- */
      $("btnRenameSiege").addEventListener("click", () => {

          alert(
            "Renseigne d'abord une enseigne du siège avant de la renommer.",
          );
          return;
        }
        const nouvelleEns = prompt(
          `Nouveau nom / nouvelle enseigne pour l'établissement siège (remplace « ${currentEns} ») :`,
        );
        if (
          !nouvelleEns ||
          !nouvelleEns.trim() ||
          nouvelleEns.trim() === currentEns
        )
          return;

        const today = new Date().toISOString().slice(0, 10);
        const dateChg = prompt(
          `Date du changement d'enseigne du siège (passage de « ${currentEns} » à « ${nouvelleEns.trim()} ») :`,
          today,
        );
        if (!dateChg) return;

        addRow("historiqueNoms", {
          ancienNom: currentEns,
          dateDebut: $("dateCreation").value || originalDateCreation || "",

          motif: "Ancienne enseigne de l'établissement siège",
        });

        addRow("annonces", {
          date: dateChg.trim(),
          type: "Changement d'enseigne (Siège)",
          texte: `L'établissement siège « ${currentEns} » change d'enseigne pour devenir « ${nouvelleEns.trim()} ».`,
        });

        $("enseigneSiege").value = nouvelleEns.trim();
        originalEnseigneSiege = nouvelleEns.trim();
      });

      /* ---------- 3. Assistant de transfert / déménagement du siège social ---------- */
      function archiverAncienSiege(dateTransfert) {
        const oldNic = $("nic").value.trim() || "00015";
        const oldAdresse = [
          $("adresse").value.trim(),
          $("cp").value.trim(),
          $("ville").value.trim(),
        ]
          .filter(Boolean)
          .join(" ");
        const oldDateOuverture =
          $("dateOuvertureSiege").value || $("dateCreation").value || "";
        const oldNafSec = collect("nafSecondaires");

        addRow("etablissements", {
          nic: oldNic,
          naf: $("naf").value,
          activite: $("activite").value,
          enseigne: $("enseigneSiege").value.trim(),
          adresse: oldAdresse,
          dateCreation: oldDateOuverture,
          dateFermeture: dateTransfert,
          roleEtab: "Ancien siège social (transféré)",
          nafSecondaires: oldNafSec,
        });

        return { oldNic, oldAdresse };
      }

      $("btnTransferSiege").addEventListener("click", () => {
        const oldAdresse = [
          $("adresse").value.trim(),
          $("cp").value.trim(),
          $("ville").value.trim(),
        ]
          .filter(Boolean)
          .join(" ");
        const today = new Date().toISOString().slice(0, 10);
        const dateTransfert = prompt(
          `Date du transfert / déménagement du siège social (fermeture de l'ancien siège au « ${oldAdresse || "adresse actuelle"} ») :`,
          today,
        );
        if (!dateTransfert) return;

        const nvAdresse = prompt(
          "Nouvelle adresse du siège social (numéro et voie) :",
        );
        if (!nvAdresse || !nvAdresse.trim()) return;
        const nvCp =
          prompt("Nouveau code postal du siège :", $("cp").value) || "";
        const nvVille =
          prompt("Nouvelle ville du siège :", $("ville").value) || "";
        const nvEnseigne = prompt(
          "Enseigne du nouveau siège (laisser tel quel ou modifier) :",
          $("enseigneSiege").value,
        );

        // 1. Archive l'ancien siège social comme établissement fermé ("Ancien siège social (transféré)")
        const { oldNic } = archiverAncienSiege(dateTransfert.trim());

        // 2. Génère un nouveau NIC libre pour le nouveau siège et met à jour les coordonnées
        const nvNic = prochainNicEtablissement();
        $("nic").value = nvNic;
        $("adresse").value = nvAdresse.trim();
        $("cp").value = nvCp.trim();
        $("ville").value = nvVille.trim();
        $("dateOuvertureSiege").value = dateTransfert.trim();
        if (nvEnseigne !== null) {
          $("enseigneSiege").value = nvEnseigne.trim();
          originalEnseigneSiege = nvEnseigne.trim();

        // 3. Ajoute automatiquement une annonce légale de transfert de siège
        addRow("annonces", {
          date: dateTransfert.trim(),
          type: "Transfert du siège social",
          texte: `Transfert du siège social de « ${oldAdresse} » (SIRET ${fmtSiret($("siren").value + oldNic)}, fermé) vers « ${nvAdresse.trim()} ${nvCp.trim()} ${nvVille.trim()} » (nouveau SIRET ${fmtSiret($("siren").value + nvNic)}).`,
        });
      });

      /* ---------- Assistant de reprise suite à faillite / cession ---------- */
      function promptReprise(ancienNom) {
        const today = new Date().toISOString().slice(0, 10);
        const dateReprise = prompt(
          `Date de reprise / transfert (suite à la faillite ou cession de « ${ancienNom || "l'ancien groupe"} ») :`,
          today,
        );
        if (!dateReprise) return null;

        const repreneurNom = prompt(
          "Nom du repreneur (Groupe, Établissement, Salariés de l'entreprise, État français…) :",
        );
        if (!repreneurNom || !repreneurNom.trim()) return null;

        const match = knownEntities.find(
          (x) => norm(x.label) === norm(repreneurNom.trim()),
        );
        const repreneurCode = prompt(
          "SIREN (9 ch.), SIRET (14 ch.) ou code (SALARIES, ETAT-APE…) du repreneur :",
          match ? match.code : "",
        );
        const pct = prompt(
          "Pourcentage de détention par le repreneur (%) :",
          "100",
        );
        const motif = prompt(
          "Motif de la fin de détention pour l'ancien propriétaire :",
          "Ancien groupe (Faillite / Liquidation)",
        );

        return {
          dateReprise: dateReprise.trim(),
          repreneurNom: repreneurNom.trim(),
          repreneurCode: (repreneurCode || "").trim(),
          pourcentage: pct !== null && pct !== "" ? Number(pct) : 100,
          motifAncien: motif || "Ancien groupe (Faillite / Liquidation)",
        };
      }

      /* ---------- Codes NAF ---------- */
      const nafLabel = (c) => (NAF.find((x) => x[0] === c) || [])[1] || "";
      function nafOptions(filter = "", keep = "") {
        const t = norm(filter);
        const list = NAF.filter(
          ([c, l]) => !t || norm(c + " " + l).includes(t),
        );
        let html =
          '<option value="">— Choisir un code NAF —</option>' +
          list
            .map(
              ([c, l]) =>
                `<option value="${esc(c)}">${esc(c)} — ${esc(l)}</option>`,
            )
            .join("");
        if (keep && !list.some((x) => x[0] === keep))
          html += `<option value="${esc(keep)}">${esc(keep)} ${esc(nafLabel(keep))}</option>`;
        return html;
      }
      const optsFor = (spec) =>
        spec === "NAF"
          ? [["", "—"], ...NAF.map(([c, l]) => [c, `${c} — ${l}`])]
          : ["", ...spec].map((v) => [v, v || "—"]);

      $("nafFilter").addEventListener("input", () => {
        const cur = $("naf").value;
        $("naf").innerHTML = nafOptions($("nafFilter").value, cur);
        $("naf").value = cur;
      });
      $("naf").addEventListener("change", () => {
        const a = $("activite").value;
        if (!a || NAF.some((x) => x[1] === a))
          $("activite").value = nafLabel($("naf").value);
        refreshActivitesDatalist();
      });
      $("activite").addEventListener("input", refreshActivitesDatalist);

      function refreshActivitesDatalist() {
        const items = new Set(["Toute l'entreprise (Unité légale)"]);
        const mainNaf = $("naf").value;
        const mainAct = $("activite").value || nafLabel(mainNaf);
        if (mainNaf || mainAct)
          items.add(`${mainNaf ? mainNaf + " — " : ""}${mainAct}`.trim());

        document
          .querySelectorAll(
            'fieldset[data-sec="nafSecondaires"] .row, fieldset[data-sec="etablissements"] .row, .sub-naf-row',
          )
          .forEach((r) => {
            const n =
              r.querySelector('[data-k="naf"], [data-subk="naf"]')?.value || "";
            const a =
              r.querySelector('[data-k="activite"], [data-subk="activite"]')
                ?.value || nafLabel(n);
            if (n || a) items.add(`${n ? n + " — " : ""}${a}`.trim());
          });

        $("dl-activites").innerHTML = [...items]
          .map((x) => `<option value="${esc(x)}"></option>`)
          .join("");
      }

      /* ---------- Connexion ---------- */
      onAuthStateChanged(auth, (user) => {
        $("login").classList.toggle("hidden", !!user);
        $("panel").classList.toggle("hidden", !user);
        $("logout").classList.toggle("hidden", !user);
        if (user) loadList();
      });
      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await signInWithEmailAndPassword(
            auth,
            $("email").value,
            $("pwd").value,
          );
        } catch {
          $("loginErr").textContent = "Identifiants incorrects.";
        }
      });
      $("logout").addEventListener("click", () => signOut(auth));

      /* ---------- Sections répétables ---------- */
      function buildSections() {
        $("sections").innerHTML = Object.entries(SECTIONS)
          .map(([k, s]) => {
            const quickBtns =
              k === "groupes"
                ? `<button type="button" class="btn sec small add-etat" style="margin-left:6px">🏛️ + Actionnaire État</button>
                   <button type="button" class="btn sec small add-salaries" style="margin-left:6px">👥 + Actionnariat Salariés</button>`
                : "";
            return `
        <fieldset data-sec="${k}"><legend>${s.title}</legend>
          <div class="rows"></div>
          <div class="actions" style="margin-top:6px">
            <button type="button" class="btn sec small add">+ Ajouter</button>
            ${quickBtns}
          </div>
        </fieldset>`;
          })
          .join("");

        document.querySelectorAll("fieldset[data-sec]").forEach((fs) => {
          fs.querySelector(".add").addEventListener("click", () =>
            addRow(fs.dataset.sec),
          );
          const btnEtat = fs.querySelector(".add-etat");
          if (btnEtat) {
            btnEtat.addEventListener("click", () =>
              addRow("groupes", {
                groupe:
                  "État français (Agence des participations de l'État - APE)",
                sirenGroupe: "ETAT-APE",
                activiteCible: "Toute l'entreprise (Unité légale)",
                pourcentage: 100,
                type: "Participation publique (État / Collectivité)",
                dateDebut: $("dateCreation").value || "",
              }),
            );
          }
          const btnSal = fs.querySelector(".add-salaries");
          if (btnSal) {
            btnSal.addEventListener("click", () =>
              addRow("groupes", {
                groupe:
                  "Salariés de l'entreprise (Actionnariat salarié / FCPE)",
                sirenGroupe: "SALARIES",
                activiteCible: "Toute l'entreprise (Unité légale)",
                pourcentage: 10,
                type: "Actionnariat salarié (Salariés / FCPE / SCOP)",
                dateDebut: $("dateCreation").value || "",
              }),
            );
          }
        });
      }

      /* Sous-ligne 1 : Activité NAF secondaire propre à un établissement */
      function addEtabSubNaf(container, subVal = {}) {
        const sr = document.createElement("div");
        sr.className = "sub-row sub-naf-row";
        sr.innerHTML = `
          <div>
            <label>Code NAF secondaire</label>
            <select data-subk="naf">${optsFor("NAF")
              .map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`)
              .join("")}</select>
          </div>
          <div>
            <label>Libellé de l'activité secondaire</label>
            <input data-subk="activite" type="text" value="${esc(subVal.activite || "")}" placeholder="Rempli automatiquement" />
          </div>
          <button type="button" class="btn danger small rm-sub">✕</button>
        `;
        const sel = sr.querySelector('select[data-subk="naf"]');
        const inp = sr.querySelector('input[data-subk="activite"]');
        if (subVal.naf) {
          if (![...sel.options].some((o) => o.value === subVal.naf))
            sel.add(new Option(subVal.naf, subVal.naf));
          sel.value = subVal.naf;
        }
        sel.addEventListener("change", () => {
          if (!inp.value || NAF.some((x) => x[1] === inp.value))
            inp.value = nafLabel(sel.value);
          refreshActivitesDatalist();
        });
        inp.addEventListener("input", refreshActivitesDatalist);
        sr.querySelector(".rm-sub").addEventListener("click", () => {
          sr.remove();
          refreshActivitesDatalist();
        });
        container.appendChild(sr);
      }

      /* Sous-ligne 2 : Historique des anciens noms / enseignes propre à un établissement */
      function addEtabSubHistNom(container, subNom = {}) {
        const sr = document.createElement("div");
        sr.className = "sub-row sub-hist-nom-row";
        sr.innerHTML = `
          <div>
            <label>Ancien nom / Ancienne enseigne de l'établissement</label>
            <input data-subnk="ancienNom" type="text" value="${esc(subNom.ancienNom || "")}" placeholder="Ex. Ancien nom de la chaîne ou du magasin" />
          </div>
          <div>
            <label>Utilisé du</label>
            <input data-subnk="dateDebut" type="date" value="${esc(subNom.dateDebut || "")}" />
          </div>
          <div>
            <label>Jusqu'au (date du changement)</label>
            <input data-subnk="dateChangement" type="date" value="${esc(subNom.dateChangement || "")}" />
          </div>
          <div>
            <label>Motif / Mention</label>
            <input data-subnk="motif" type="text" value="${esc(subNom.motif || "")}" placeholder="Ex. Rebranding, rachat, changement d'enseigne…" />
          </div>
          <button type="button" class="btn danger small rm-sub">✕</button>
        `;
        sr.querySelector(".rm-sub").addEventListener("click", () =>
          sr.remove(),
        );
        container.appendChild(sr);
      }

      /* Sous-ligne 3 : Rattachement d'un établissement à un Groupe / Repreneur / État / Salariés */
      function addEtabSubGroupe(container, subGrp = {}) {
        const sr = document.createElement("div");
        sr.className = "sub-row sub-grp-row";
        sr.innerHTML = `
          <div>
            <label>Actionnaire (Groupe, État, Salariés, Repreneur…)</label>
            <input data-subgk="groupe" list="dl-entites" type="text" value="${esc(subGrp.groupe || "")}" placeholder="Groupe, État français, Salariés…" />
          </div>
          <div>
            <label>SIREN, SIRET ou Code</label>
            <input data-subgk="sirenGroupe" type="text" value="${esc(subGrp.sirenGroupe || "")}" placeholder="Auto ou facultatif" />
          </div>
          <div>
            <label>Activité rattachée de cet étab.</label>
            <input data-subgk="activiteCible" list="dl-activites" type="text" value="${esc(subGrp.activiteCible || "")}" placeholder="Vide = tout l'établissement" />
          </div>
          <div>
            <label>Détention (%)</label>
            <input data-subgk="pourcentage" type="number" min="0" max="100" step="0.01" value="${esc(subGrp.pourcentage ?? "")}" />
          </div>
          <div>
            <label>Statut / Nature</label>
            <select data-subgk="type">
              ${optsFor(TYPES_RATTACHEMENT)
                .map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`)
                .join("")}
            </select>
          </div>
          <div>
            <label>Depuis le (ou reprise)</label>
            <input data-subgk="dateDebut" type="date" value="${esc(subGrp.dateDebut || "")}" />
          </div>
          <div>
            <label>Jusqu'au (si faillite/cédé)</label>
            <input data-subgk="dateFin" type="date" value="${esc(subGrp.dateFin || "")}" />
          </div>
          <div>
            <label>Mention / Historique</label>
            <input data-subgk="commentaire" type="text" value="${esc(subGrp.commentaire || "")}" placeholder="Ex. Repris suite faillite..." />
          </div>
          <div style="display:flex;gap:6px;align-items:end">
            <button type="button" class="btn small reprise-btn transfer-sub-grp" title="Archiver cet ancien groupe et créer la ligne du repreneur">⚡ Transférer à un repreneur</button>
            <button type="button" class="btn danger small rm-sub">✕</button>
          </div>
        `;
        const selType = sr.querySelector('[data-subgk="type"]');
        if (subGrp.type) {
          if (![...selType.options].some((o) => o.value === subGrp.type))
            selType.add(new Option(subGrp.type, subGrp.type));
          selType.value = subGrp.type;
        }
        const inpGrp = sr.querySelector('[data-subgk="groupe"]');
        const inpCode = sr.querySelector('[data-subgk="sirenGroupe"]');
        inpGrp.addEventListener("input", () => {
          const val = inpGrp.value.trim();
          const match = knownEntities.find((x) => norm(x.label) === norm(val));
          if (match) {
            if (!inpCode.value) inpCode.value = match.code || "";
            if (match.defaultType && !selType.value) {
              selType.value = match.defaultType;
            } else if (match.isEtab && !selType.value) {
              selType.value = "Détenue par un établissement du groupe";
            }
          } else if (/^etat\b|^état\b/i.test(val) && !selType.value) {
            selType.value = "Participation publique (État / Collectivité)";
            if (!inpCode.value) inpCode.value = "ETAT-APE";
          } else if (/salari[eé]s?|scop|fcpe/i.test(val) && !selType.value) {
            selType.value = "Actionnariat salarié (Salariés / FCPE / SCOP)";
            if (!inpCode.value) inpCode.value = "SALARIES";
          }
        });

        // Bouton de transfert rapide d'un établissement vers un repreneur
        sr.querySelector(".transfer-sub-grp").addEventListener("click", () => {
          const ancienNom =
            inpGrp.value.trim() || $("denomination").value.trim();
          const info = promptReprise(ancienNom);
          if (!info) return;

          if (!inpGrp.value.trim() && $("denomination").value.trim()) {
            inpGrp.value = $("denomination").value.trim();
            inpCode.value = $("siren").value.trim();
          }
          sr.querySelector('[data-subgk="dateFin"]').value = info.dateReprise;
          if (![...selType.options].some((o) => o.value === info.motifAncien)) {
            selType.add(new Option(info.motifAncien, info.motifAncien));
          }
          selType.value = info.motifAncien;
          const inpComm = sr.querySelector('[data-subgk="commentaire"]');
          inpComm.value = `Repris par ${info.repreneurNom} le ${new Date(info.dateReprise + "T00:00:00").toLocaleDateString("fr-FR")}`;

          addEtabSubGroupe(container, {
            groupe: info.repreneurNom,
            sirenGroupe: info.repreneurCode,
            activiteCible: sr
              .querySelector('[data-subgk="activiteCible"]')
              .value.trim(),
            pourcentage: info.pourcentage,
            type: "Reprise / Rachat suite à faillite",
            dateDebut: info.dateReprise,
            dateFin: "",
            commentaire: ancienNom
              ? `Repris suite à la faillite / cession de ${ancienNom}`
              : "Reprise d'établissement",
          });
        });

        sr.querySelector(".rm-sub").addEventListener("click", () =>
          sr.remove(),
        );
        container.appendChild(sr);
      }

      function addRow(sec, values = {}) {
        if (sec === "etablissements") {
          if (!values.nic && values.siret) {
            values.nic = String(values.siret).slice(9);
          } else if (!values.nic) {
            values.nic = prochainNicEtablissement();
          }
          if (!values.roleEtab) {
            values.roleEtab = "Établissement secondaire";
          }
        }
        const rows = document.querySelector(
          `fieldset[data-sec="${sec}"] .rows`,
        );
        const row = document.createElement("div");
        row.className = sec === "etablissements" ? "row etab-row-card" : "row";
        row.innerHTML =
          SECTIONS[sec].cols
            .map(([k, label, type, opts]) => {
              if (type === "select") {
                return `<div><label>${label}</label><select data-k="${k}">${optsFor(
                  opts,
                )
                  .map(
                    ([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`,
                  )
                  .join("")}</select></div>`;
              }
              if (sec === "etablissements" && k === "nic") {
                return `<div><label>${label}</label><div style="display:flex;gap:6px"><input data-k="nic" type="text" maxlength="5" pattern="\\d{5}" value="${esc(values[k])}"><button type="button" class="btn sec small regen-etab-nic" title="Générer un autre NIC">🔄</button></div></div>`;
              }
              if (sec === "etablissements" && k === "enseigne") {
                return `<div><label>${label}</label><div style="display:flex;gap:6px"><input data-k="enseigne" type="text" value="${esc(values[k])}" placeholder="Nom de l'établissement / chaîne / enseigne"><button type="button" class="btn small reprise-btn rename-etab-btn" title="Changer le nom de cet établissement et archiver l'ancien nom dans son historique">✏️ Renommer</button></div></div>`;
              }
              return `<div><label>${label}</label><input data-k="${k}" type="${type || "text"}" ${
                k === "pourcentage" ? 'min="0" max="100" step="0.01"' : ""
              } ${
                sec === "finances" && k === "annee"
                  ? 'placeholder="Ex. 2025" maxlength="4"'
                  : ""
              } value="${esc(values[k])}"></div>`;
            })
            .join("") +
          `<div style="display:flex;gap:6px;align-items:end">
            ${sec === "groupes" ? `<button type="button" class="btn small reprise-btn transfer-grp" title="Archiver cet ancien groupe et créer la ligne du repreneur">⚡ Transférer à un repreneur</button>` : ""}
            ${sec === "etablissements" ? `<button type="button" class="btn small reprise-btn promote-siege-btn" title="Faire de cet établissement le nouveau siège social et fermer l'ancien siège">🏛️ Promouvoir en siège</button>` : ""}
            <button type="button" class="btn danger small rm">✕</button>
          </div>`;

        // Bouton pour régénérer le NIC d'un établissement secondaire
        const btnRegenEtabNic = row.querySelector(".regen-etab-nic");
        if (btnRegenEtabNic) {
          btnRegenEtabNic.addEventListener("click", () => {
            const inpNic = row.querySelector('input[data-k="nic"]');
            inpNic.value = genererNic(
              $("siren").value,
              Math.floor(Math.random() * 89) + 10,
            );
          });
        }

        // Bouton pour promouvoir un établissement existant en nouveau siège social
        const btnPromoteSiege = row.querySelector(".promote-siege-btn");
        if (btnPromoteSiege) {
          btnPromoteSiege.addEventListener("click", () => {
            const targetNic = row
              .querySelector('input[data-k="nic"]')
              .value.trim();
            const targetEns = row
              .querySelector('input[data-k="enseigne"]')
              .value.trim();
            const targetAddrFull = row
              .querySelector('input[data-k="adresse"]')
              .value.trim();
            const targetDateCrea = row
              .querySelector('input[data-k="dateCreation"]')
              .value.trim();
            const targetNaf = row.querySelector('select[data-k="naf"]').value;
            const targetAct = row
              .querySelector('input[data-k="activite"]')
              .value.trim();

            const today = new Date().toISOString().slice(0, 10);
            const dateTransfert = prompt(
              `Date du transfert du siège social vers cet établissement (${targetEns || "NIC " + targetNic}) — l'ancien siège sera marqué comme fermé à cette date :`,
              today,
            );
            if (!dateTransfert) return;

            const m = targetAddrFull.match(/^(.*?)\s+(\d{5})\s+(.+)$/);
            const nvVoie = m
              ? m[1]
              : prompt("Numéro et rue du nouveau siège :", targetAddrFull) ||
                targetAddrFull;
            const nvCp = m
              ? m[2]
              : prompt("Code postal du nouveau siège :", $("cp").value) ||
                $("cp").value;
            const nvVille = m
              ? m[3]
              : prompt("Ville du nouveau siège :", $("ville").value) ||
                $("ville").value;

            // 1. Archive l'ancien siège dans la liste des établissements fermés
            const { oldNic, oldAdresse } = archiverAncienSiege(
              dateTransfert.trim(),
            );

            // 2. Met à jour le siège social en haut avec les informations de cet établissement
            $("nic").value = targetNic;
            $("adresse").value = nvVoie.trim();
            $("cp").value = nvCp.trim();
            $("ville").value = nvVille.trim();
            $("enseigneSiege").value = targetEns;
            originalEnseigneSiege = targetEns;
            $("dateOuvertureSiege").value =
              targetDateCrea || dateTransfert.trim();
            if (targetNaf) {
              $("naf").value = targetNaf;
              $("activite").value = targetAct || nafLabel(targetNaf);
            }

            // 3. Ajoute l'annonce légale et retire la ligne (devenue le siège social actuel)
            addRow("annonces", {
              date: dateTransfert.trim(),
              type: "Transfert du siège social",
              texte: `Transfert du siège social de « ${oldAdresse} » (SIRET ${fmtSiret($("siren").value + oldNic)}, fermé) vers l'établissement « ${nvVoie} ${nvCp} ${nvVille} » (SIRET ${fmtSiret($("siren").value + targetNic)}).`,
            });
            row.remove();
            refreshActivitesDatalist();
          });
        }

        row.querySelectorAll("select[data-k]").forEach((s) => {
          const v = values[s.dataset.k] ?? "";
          if (v && ![...s.options].some((o) => o.value === v))
            s.add(new Option(v, v));
          s.value = v;
        });

        // Remplissage automatique du libellé NAF
        if (sec === "nafSecondaires" || sec === "etablissements") {
          const s = row.querySelector('select[data-k="naf"]');
          const a = row.querySelector('input[data-k="activite"]');
          s.addEventListener("change", () => {
            if (!a.value || NAF.some((x) => x[1] === a.value))
              a.value = nafLabel(s.value);
            refreshActivitesDatalist();
          });
          a.addEventListener("input", refreshActivitesDatalist);
        }

        // Remplissage automatique de la date de clôture au 31/12 de l'année saisie (modifiable manuellement)
        if (sec === "finances") {
          const inpAnnee = row.querySelector('input[data-k="annee"]');
          const inpCloture = row.querySelector('input[data-k="dateCloture"]');

          if (
            inpAnnee.value &&
            /^\d{4}$/.test(inpAnnee.value.trim()) &&
            !inpCloture.value
          ) {
            inpCloture.value = `${inpAnnee.value.trim()}-12-31`;
          }

          let clotureModifieeManuellement = Boolean(
            values.dateCloture &&
            values.annee &&
            values.dateCloture !== `${values.annee}-12-31`,
          );

          inpCloture.addEventListener("input", () => {
            const a = inpAnnee.value.trim();
            clotureModifieeManuellement =
              inpCloture.value !== "" && inpCloture.value !== `${a}-12-31`;
          });

          inpAnnee.addEventListener("input", () => {
            const a = inpAnnee.value.trim();
            if (
              /^\d{4}$/.test(a) &&
              (!inpCloture.value || !clotureModifieeManuellement)
            ) {
              inpCloture.value = `${a}-12-31`;
            }
          });
        }

        // Sous-blocs propres à chaque établissement : (1) Historique des noms + (2) NAF secondaires + (3) Groupes / Actionnaires
        if (sec === "etablissements") {
          // 1. Sous-bloc Historique des anciens noms / enseignes de cet établissement
          const subBoxHist = document.createElement("div");
          subBoxHist.className = "sub-etab-box hist-box";
          subBoxHist.innerHTML = `
            <span class="sub-title">Historique des anciens noms / enseignes de cet établissement</span>
            <div class="sub-hist-nom-rows"></div>
            <button type="button" class="btn sec small add-sub-hist-nom">+ Ajouter un ancien nom à cet établissement</button>
          `;
          const subHistContainer =
            subBoxHist.querySelector(".sub-hist-nom-rows");
          subBoxHist
            .querySelector(".add-sub-hist-nom")
            .addEventListener("click", () =>
              addEtabSubHistNom(subHistContainer),
            );
          (values.historiqueNoms || []).forEach((sn) =>
            addEtabSubHistNom(subHistContainer, sn),
          );
          row.appendChild(subBoxHist);

          // Bouton rapide "✏️ Renommer" sur l'enseigne de l'établissement
          const btnRenameEtab = row.querySelector(".rename-etab-btn");
          const inpEnsEtab = row.querySelector('input[data-k="enseigne"]');
          const inpNicEtab = row.querySelector('input[data-k="nic"]');
          const inpDateCreaEtab = row.querySelector(
            'input[data-k="dateCreation"]',
          );
          if (btnRenameEtab && inpEnsEtab) {
            btnRenameEtab.addEventListener("click", () => {
              const nicKey = inpNicEtab.value.trim();
              const currentEns =
                inpEnsEtab.value.trim() || originalEtabNames[nicKey] || "";
              if (!currentEns) {
                alert(
                  "Renseigne d'abord le nom / l'enseigne actuelle de l'établissement avant de le renommer.",
                );
                return;
              }
              const nouveauNom = prompt(
                `Nouveau nom / nouvelle enseigne de l'établissement (remplace « ${currentEns} ») :`,
              );
              if (
                !nouveauNom ||
                !nouveauNom.trim() ||
                nouveauNom.trim() === currentEns
              )
                return;

              const today = new Date().toISOString().slice(0, 10);
              const dateChg = prompt(
                `Date du changement de nom de l'établissement (passage de « ${currentEns} » à « ${nouveauNom.trim()} ») :`,
                today,
              );
              if (!dateChg) return;

              const motif =
                prompt(
                  "Motif du changement de nom (ex. Changement d'enseigne, Rebranding suite rachat…) :",
                  "Changement d'enseigne / Rebranding",
                ) || "Changement d'enseigne";

              const prevHistRows = [
                ...subHistContainer.querySelectorAll(".sub-hist-nom-row"),
              ];
              const lastDate =
                prevHistRows.length > 0
                  ? prevHistRows[prevHistRows.length - 1].querySelector(
                      '[data-subnk="dateChangement"]',
                    ).value || ""
                  : inpDateCreaEtab.value || $("dateCreation").value || "";

              addEtabSubHistNom(subHistContainer, {
                ancienNom: currentEns,
                dateDebut: lastDate,
                dateChangement: dateChg.trim(),
                motif: motif.trim(),
              });

              addRow("annonces", {
                date: dateChg.trim(),
                type: "Changement de nom d'établissement",
                texte: `L'établissement « ${currentEns} » (NIC ${nicKey}) change de nom pour devenir « ${nouveauNom.trim()} » (${motif.trim()}).`,
              });

              inpEnsEtab.value = nouveauNom.trim();
              if (nicKey) originalEtabNames[nicKey] = nouveauNom.trim();
            });
          }

          // 2. Sous-bloc Activités NAF secondaires
          const subBoxNaf = document.createElement("div");
          subBoxNaf.className = "sub-etab-box";
          subBoxNaf.innerHTML = `
            <span class="sub-title">Activités secondaires de cet établissement (propres à sa fiche)</span>
            <div class="sub-naf-rows"></div>
            <button type="button" class="btn sec small add-sub-naf">+ Ajouter une activité secondaire à cet établissement</button>
          `;
          const subNafContainer = subBoxNaf.querySelector(".sub-naf-rows");
          subBoxNaf
            .querySelector(".add-sub-naf")
            .addEventListener("click", () => addEtabSubNaf(subNafContainer));
          (values.nafSecondaires || []).forEach((sv) =>
            addEtabSubNaf(subNafContainer, sv),
          );
          row.appendChild(subBoxNaf);

          // 3. Sous-bloc Rattachement Groupes / État / Salariés / Repreneurs
          const subBoxGrp = document.createElement("div");
          subBoxGrp.className = "sub-etab-box grp-box";
          subBoxGrp.innerHTML = `
            <span class="sub-title">Actionnariat & Rattachement de cet établissement (Groupe, État, Salariés, Repreneur — historique conservé)</span>
            <div class="sub-grp-rows"></div>
            <div class="actions" style="margin-top:6px">
              <button type="button" class="btn sec small add-sub-grp">+ Rattacher à un groupe / repreneur</button>
              <button type="button" class="btn sec small add-sub-etat">🏛️ + État</button>
              <button type="button" class="btn sec small add-sub-sal">👥 + Salariés</button>
            </div>
          `;
          const subGrpContainer = subBoxGrp.querySelector(".sub-grp-rows");
          subBoxGrp
            .querySelector(".add-sub-grp")
            .addEventListener("click", () => addEtabSubGroupe(subGrpContainer));
          subBoxGrp
            .querySelector(".add-sub-etat")
            .addEventListener("click", () =>
              addEtabSubGroupe(subGrpContainer, {
                groupe:
                  "État français (Agence des participations de l'État - APE)",
                sirenGroupe: "ETAT-APE",
                pourcentage: 100,
                type: "Participation publique (État / Collectivité)",
                dateDebut:
                  inpDateCreaEtab.value || $("dateCreation").value || "",
              }),
            );
          subBoxGrp
            .querySelector(".add-sub-sal")
            .addEventListener("click", () =>
              addEtabSubGroupe(subGrpContainer, {
                groupe: "Salariés de l'établissement (Actionnariat salarié)",
                sirenGroupe: "SALARIES",
                pourcentage: 10,
                type: "Actionnariat salarié (Salariés / FCPE / SCOP)",
                dateDebut:
                  inpDateCreaEtab.value || $("dateCreation").value || "",
              }),
            );
          (values.groupes || []).forEach((sg) =>
            addEtabSubGroupe(subGrpContainer, sg),
          );
          row.appendChild(subBoxGrp);
        }

        // Autocomplétion + Bouton de reprise pour la section Groupes / Actionnaires de l'entreprise
        if (sec === "groupes") {
          const inpGrp = row.querySelector('input[data-k="groupe"]');
          const inpCode = row.querySelector('input[data-k="sirenGroupe"]');
          const inpAct = row.querySelector('input[data-k="activiteCible"]');
          const selType = row.querySelector('select[data-k="type"]');
          inpGrp.setAttribute("list", "dl-entites");
          inpAct.setAttribute("list", "dl-activites");
          inpGrp.addEventListener("input", () => {
            const val = inpGrp.value.trim();
            const match = knownEntities.find(
              (x) => norm(x.label) === norm(val),
            );
            if (match) {
              if (!inpCode.value) inpCode.value = match.code || "";
              if (match.defaultType && !selType.value) {
                selType.value = match.defaultType;
              } else if (match.isEtab && !selType.value) {
                selType.value = "Détenue par un établissement du groupe";
              }
            } else if (/^etat\b|^état\b/i.test(val) && !selType.value) {
              selType.value = "Participation publique (État / Collectivité)";
              if (!inpCode.value) inpCode.value = "ETAT-APE";
            } else if (/salari[eé]s?|scop|fcpe/i.test(val) && !selType.value) {
              selType.value = "Actionnariat salarié (Salariés / FCPE / SCOP)";
              if (!inpCode.value) inpCode.value = "SALARIES";
            }
          });

          row.querySelector(".transfer-grp").addEventListener("click", () => {
            const ancienNom = inpGrp.value.trim();
            const info = promptReprise(ancienNom);
            if (!info) return;

            row.querySelector('input[data-k="dateFin"]').value =
              info.dateReprise;
            if (
              ![...selType.options].some((o) => o.value === info.motifAncien)
            ) {
              selType.add(new Option(info.motifAncien, info.motifAncien));
            }
            selType.value = info.motifAncien;
            const inpComm = row.querySelector('input[data-k="commentaire"]');
            if (inpComm) {
              inpComm.value = `Reprise par ${info.repreneurNom} le ${new Date(info.dateReprise + "T00:00:00").toLocaleDateString("fr-FR")}`;
            }

            addRow("groupes", {
              groupe: info.repreneurNom,
              sirenGroupe: info.repreneurCode,
              activiteCible: inpAct.value.trim(),
              pourcentage: info.pourcentage,
              type: "Reprise / Rachat suite à faillite",
              dateDebut: info.dateReprise,
              dateFin: "",
              commentaire: ancienNom
                ? `Repris suite à la faillite / cession de ${ancienNom}`
                : "Reprise d'entreprise",
            });
          });
        }

        row.querySelector(".rm").addEventListener("click", () => {
          row.remove();
          refreshActivitesDatalist();
        });
        rows.appendChild(row);
        refreshActivitesDatalist();
      }

      function collect(sec) {
        return [
          ...document.querySelectorAll(`fieldset[data-sec="${sec}"] .row`),
        ]
          .map((r) => {
            const o = {};
            r.querySelectorAll("input[data-k], select[data-k]").forEach(
              (i) =>
                (o[i.dataset.k] =
                  i.type === "number" && i.value !== ""
                    ? Number(i.value)
                    : i.value.trim()),
            );
            if (sec === "etablissements") {
              o.historiqueNoms = [...r.querySelectorAll(".sub-hist-nom-row")]
                .map((sr) => ({
                  ancienNom: sr
                    .querySelector('[data-subnk="ancienNom"]')
                    .value.trim(),
                  dateDebut: sr
                    .querySelector('[data-subnk="dateDebut"]')
                    .value.trim(),
                  dateChangement: sr
                    .querySelector('[data-subnk="dateChangement"]')
                    .value.trim(),
                  motif: sr.querySelector('[data-subnk="motif"]').value.trim(),
                }))
                .filter((x) => x.ancienNom);

              o.nafSecondaires = [...r.querySelectorAll(".sub-naf-row")]
                .map((sr) => ({
                  naf: sr.querySelector('[data-subk="naf"]').value.trim(),
                  activite: sr
                    .querySelector('[data-subk="activite"]')
                    .value.trim(),
                }))
                .filter((x) => x.naf || x.activite);

              o.groupes = [...r.querySelectorAll(".sub-grp-row")]
                .map((sr) => {
                  const pctVal = sr.querySelector(
                    '[data-subgk="pourcentage"]',
                  ).value;
                  return {
                    groupe: sr
                      .querySelector('[data-subgk="groupe"]')
                      .value.trim(),
                    sirenGroupe: sr
                      .querySelector('[data-subgk="sirenGroupe"]')
                      .value.trim(),
                    activiteCible: sr
                      .querySelector('[data-subgk="activiteCible"]')
                      .value.trim(),
                    pourcentage: pctVal !== "" ? Number(pctVal) : "",
                    type: sr.querySelector('[data-subgk="type"]').value.trim(),
                    dateDebut: sr
                      .querySelector('[data-subgk="dateDebut"]')
                      .value.trim(),
                    dateFin: sr
                      .querySelector('[data-subgk="dateFin"]')
                      .value.trim(),
                    commentaire: sr
                      .querySelector('[data-subgk="commentaire"]')
                      .value.trim(),
                  };
                })
                .filter((x) => x.groupe);
            }
            return o;
          })
          .filter((o) =>
            Object.entries(o).some(([k, v]) =>
              Array.isArray(v) ? v.length > 0 : v !== "",
            ),
          );
      }

      /* ---------- Liste ---------- */
      async function loadList() {
        const snap = await getDocs(
          query(collection(db, "entreprises"), orderBy("denomination")),
        );
        knownEntities = [...SPECIAL_SHAREHOLDERS];
        snap.docs.forEach((d) => {
          const e = d.data();
          knownEntities.push({
            label: e.denomination,
            code: e.siren || "",
            desc: `Entreprise · SIREN ${fmtSiren(e.siren)}`,
            isEtab: false,
          });
          if (e.enseigneSiege) {
            const siretSiege = (e.siren || "") + (e.nic || "00015");
            knownEntities.push({
              label: `${e.enseigneSiege} (${e.denomination})`,
              code: siretSiege,
              desc: `Établissement Siège · SIRET ${fmtSiret(siretSiege)}`,
              isEtab: true,
            });
          }
          (e.etablissements || []).forEach((et) => {
            const siret = et.siret || (e.siren || "") + (et.nic || "");
            const nomEtab = et.enseigne
              ? `${et.enseigne} (${e.denomination})`
              : `Établissement ${et.nic || ""} — ${e.denomination}`;
            knownEntities.push({
              label: nomEtab,
              code: siret,
              desc: `Établissement · SIRET ${fmtSiret(siret)}`,
              isEtab: true,
            });
          });
        });

        $("dl-entites").innerHTML = knownEntities
          .map((x) => `<option value="${esc(x.label)}">${esc(x.desc)}</option>`)
          .join("");

        $("nb").textContent = snap.size;
        $("tbl").innerHTML =
          `<tr><th>Dénomination (et anciens noms)</th><th>SIREN</th><th>Établissements</th><th>Actionnaires & Groupes</th><th>Ville</th><th>Statut</th><th></th></tr>` +
          snap.docs
            .map((d) => {
              const e = d.data();
              const nbEtabs = 1 + (e.etablissements || []).length;
              const anciensNoms = (e.historiqueNoms || [])
                .map((h) => h.ancienNom)
                .filter(Boolean);
              const grps = (e.groupes || [])
                .map((g) => {
                  const anc = estAncienStatut(g);
                  return `${anc ? "<s class='muted' title='Ancien propriétaire'>" : ""}${esc(g.groupe)}${g.pourcentage !== "" && g.pourcentage != null ? ` (${g.pourcentage} %)` : ""}${anc ? "</s>" : ""}`;
                })
                .join(", ");
              return `
          <tr>
            <td>
              <strong>${esc(e.denomination)}</strong>
              ${anciensNoms.length ? `<div class="muted" style="font-size:12px">Ex-nom : ${anciensNoms.map(esc).join(", ")}</div>` : ""}
            </td>
            <td>${fmtSiren(e.siren)}</td>
            <td>${nbEtabs} étab.</td>
            <td>${grps || "<span class='muted'>—</span>"}</td>
            <td>${esc(e.ville)}</td>
            <td>${esc(e.statut)}</td>
            <td class="actions">
              <a class="btn sec small" href="entreprise.html?id=${d.id}" target="_blank">Voir</a>
              <button class="btn small" data-edit="${d.id}">Modifier</button>
              <button class="btn danger small" data-del="${d.id}">Supprimer</button>
            </td>
          </tr>`;
            })
            .join("");
      }
      $("tbl").addEventListener("click", async (e) => {
        if (e.target.dataset.edit) openForm(e.target.dataset.edit);
        if (
          e.target.dataset.del &&
          confirm("Supprimer cette entreprise fictive ?")
        ) {
          await deleteDoc(doc(db, "entreprises", e.target.dataset.del));
          loadList();
        }
      });

      /* ---------- Formulaire ---------- */
      async function openForm(id = null) {
        editingId = id;
        originalEtabNames = {};
        $("form").classList.remove("hidden");
        $("form").reset();
        $("nafFilter").value = "";
        $("naf").innerHTML = nafOptions();
        buildSections();
        $("msg").textContent = "";
        $("formTitle").textContent = id
          ? "Modifier l'entreprise"
          : "Nouvelle entreprise";
        $("btnRename").classList.toggle("hidden", !id);
        $("btnRenameSiege").classList.toggle("hidden", !id);
        $("btnTransferSiege").classList.toggle("hidden", !id);

        if (id) {
          const e = (await getDoc(doc(db, "entreprises", id))).data();
          originalDenomination = (e.denomination || "").trim();
          originalEnseigneSiege = (e.enseigneSiege || "").trim();
          originalDateCreation = (e.dateCreation || "").trim();
          (e.etablissements || []).forEach((et) => {
            if (et.nic && et.enseigne) {
              originalEtabNames[et.nic] = et.enseigne.trim();
            }
          });
          $("naf").innerHTML = nafOptions("", e.naf || "");
          FIELDS.forEach((f) => ($(f).value = e[f] ?? ""));
          Object.keys(SECTIONS).forEach((s) =>
            (e[s] || []).forEach((v) => addRow(s, { ...v })),
          );
        } else {
          originalDenomination = "";
          originalEnseigneSiege = "";
          originalDateCreation = "";
          const nouveauSiren = String(
            Math.floor(Math.random() * 900000000) + 100000000,
          );
          $("siren").value = nouveauSiren;
          $("nic").value = genererNic(nouveauSiren, 1);
        }
        refreshActivitesDatalist();
        $("form").scrollIntoView({ behavior: "smooth" });
      }

      $("newBtn").addEventListener("click", () => openForm());
      $("cancel").addEventListener("click", () =>
        $("form").classList.add("hidden"),
      );

      $("genSiren").addEventListener("click", () => {
        const s = String(Math.floor(Math.random() * 900000000) + 100000000);
        $("siren").value = s;
        $("nic").value = genererNic(s, 1);
      });

      $("genNic").addEventListener("click", () => {
        const randomNum = Math.floor(Math.random() * 9) + 1;
        $("nic").value = genererNic($("siren").value, randomNum);
      });

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {};
        FIELDS.forEach(
          (f) =>
            (data[f] =
              f === "capital" && $(f).value !== ""
                ? Number($(f).value)
                : $(f).value.trim()),
        );
        Object.keys(SECTIONS).forEach((s) => (data[s] = collect(s)));

        const today = new Date().toISOString().slice(0, 10);

        // 1. Archivage auto si le nom de l'entreprise/filiale a été changé directement dans le champ
        if (
          editingId &&
          originalDenomination &&
          data.denomination &&
          data.denomination !== originalDenomination
        ) {
          const dejaArchive = (data.historiqueNoms || []).some(
            (h) => norm(h.ancienNom) === norm(originalDenomination),
          );
          if (!dejaArchive) {
            const dateChg =
              prompt(
                `Vous avez changé le nom de « ${originalDenomination} » en « ${data.denomination} ».\nÀ quelle date ce changement de nom a-t-il eu lieu ?`,
                today,
              ) || today;
            const prevDate =
              data.historiqueNoms.length > 0
                ? data.historiqueNoms[data.historiqueNoms.length - 1]
                    .dateChangement || ""
                : data.dateCreation || originalDateCreation || "";

            data.historiqueNoms.push({
              ancienNom: originalDenomination,
              dateDebut: prevDate,
              dateChangement: dateChg.trim(),
              motif: "Changement de dénomination sociale",
            });
            data.annonces.push({
              date: dateChg.trim(),
              type: "Modification de dénomination",
              texte: `Ancienne dénomination : « ${originalDenomination} » — Nouvelle dénomination : « ${data.denomination} ».`,
            });
          }
        }

        // 2. Archivage auto si l'enseigne du siège a été modifiée directement
        if (
          editingId &&
          originalEnseigneSiege &&
          data.enseigneSiege &&
          data.enseigneSiege !== originalEnseigneSiege
        ) {
          const dejaArchive = (data.historiqueNoms || []).some(
            (h) => norm(h.ancienNom) === norm(originalEnseigneSiege),
          );
          if (!dejaArchive) {
            const dateChg =
              prompt(
                `Vous avez changé l'enseigne du siège de « ${originalEnseigneSiege} » en « ${data.enseigneSiege} ».\nDate du changement :`,
                today,
              ) || today;
            data.historiqueNoms.push({
              ancienNom: originalEnseigneSiege,
              dateDebut: data.dateCreation || originalDateCreation || "",
              dateChangement: dateChg.trim(),
              motif: "Ancienne enseigne de l'établissement siège",
            });
          }
        }

        // 3. Archivage auto si le nom (enseigne) d'un établissement secondaire a été modifié directement
        if (editingId) {
          (data.etablissements || []).forEach((et) => {
            const oldEns = originalEtabNames[et.nic];
            if (oldEns && et.enseigne && et.enseigne !== oldEns) {
              et.historiqueNoms = et.historiqueNoms || [];
              const deja = et.historiqueNoms.some(
                (h) => norm(h.ancienNom) === norm(oldEns),
              );
              if (!deja) {
                const dateChg =
                  prompt(
                    `Vous avez changé le nom de l'établissement « ${oldEns} » en « ${et.enseigne} ».\nÀ quelle date ce changement a-t-il eu lieu ?`,
                    today,
                  ) || today;
                et.historiqueNoms.push({
                  ancienNom: oldEns,
                  dateDebut: et.dateCreation || data.dateCreation || "",
                  dateChangement: dateChg.trim(),
                  motif: "Changement d'enseigne / de nom d'établissement",
                });
                data.annonces.push({
                  date: dateChg.trim(),
                  type: "Changement de nom d'établissement",
                  texte: `L'établissement « ${oldEns} » (NIC ${et.nic}) devient « ${et.enseigne} ».`,
                });
              }
            }
          });
        }

        try {
          if (editingId) await setDoc(doc(db, "entreprises", editingId), data);
          else await addDoc(collection(db, "entreprises"), data);
          $("msg").textContent = "✔ Enregistré.";
          $("form").classList.add("hidden");
          loadList();
        } catch (err) {
          $("msg").innerHTML =
            `<span class="error">Erreur : ${esc(err.message)}</span>`;
        }
      });
    </script>
  </body>
</html>
